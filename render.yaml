services:
  - type: web
    name: activity-report-extractor
    runtime: python
    region: oregon
    plan: free

    # Build backend dependencies
    buildCommand: pip install -r backend/requirements.txt

    # Start FastAPI ASGI server
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
